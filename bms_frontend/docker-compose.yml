services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: qbitlabs-bms-frontend:local
    container_name: qbitlabs-bms-frontend-local
    restart: unless-stopped
    ports:
      - "3000:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/default.local.conf:/etc/nginx/conf.d/default.conf:ro